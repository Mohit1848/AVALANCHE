# Colorado SNOTEL Telemetry Stations Configuration
# Controls enabled telemetry stations for live ingestion, feature extraction, and prediction.

stations:
  - station_id: "335"
    station_triplet: "335:CO:SNTL"
    name: "Berthoud Summit"
    zone_id: "CO_FRONT_RANGE"
    zone_name: "Front Range"
    latitude: 39.7980
    longitude: -105.7780
    elevation_m: 3444.0
    enabled: true
    default_slope_deg: 38.0
    default_aspect_deg: 45.0
    available_variables:
      - "TOBS"   # Air Temperature
      - "SNWD"   # Snow Depth
      - "WTEQ"   # Snow Water Equivalent
      - "PREC"   # Precipitation Accumulation

