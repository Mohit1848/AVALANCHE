# Himalayan Domain Spatial Configuration
domain: "HIMALAYA"
spatial:
  method: "IDW"
  method_version: "2.0"
  idw:
    power: 2.0
    default_search_radius_km: 65.0
    min_stations: 2
    max_stations: 5
  quality_thresholds:
    excellent_max_distance_km: 25.0
    excellent_min_stations: 3
    good_max_distance_km: 45.0
    good_min_stations: 2
    degraded_max_distance_km: 80.0
  computation_limits:
    max_bbox_span_degrees: 2.0
    max_grid_points: 625
    min_grid_spacing_degrees: 0.03
    max_search_radius_km: 120.0
  zone_aggregation:
    high_risk_threshold_score: 70.0
    medium_risk_threshold_score: 40.0
    high_risk_area_escalation_fraction: 0.25
  bounding_box:
    min_latitude: 26.5
    max_latitude: 36.5
    min_longitude: 73.0
    max_longitude: 89.5
