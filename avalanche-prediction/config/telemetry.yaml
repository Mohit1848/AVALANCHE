# USDA NRCS AWDB Telemetry Configuration
# Controls Colorado live data ingestion, freshness thresholds, and station mapping.

colorado:
  provider: "NRCS_AWDB"
  enabled: true
  base_url: "https://wcc.sc.egov.usda.gov/awdbRestApi/services/v1"
  timeout_seconds: 15
  max_retries: 3
  retry_backoff_factor: 1.5
  refresh_interval_minutes: 15

  freshness:
    live_max_age_minutes: 120      # <= 2h: LIVE
    recent_max_age_minutes: 360    # <= 6h: RECENT / DEGRADED
    stale_after_minutes: 360       # > 6h: STALE (Predictions SUPPRESSED)
    historical_after_minutes: 1440 # > 24h: HISTORICAL

  elements:
    - code: "TOBS"
      name: "Air Temperature Observed"
      unit: "deg_f"
      canonical_name: "temperature"
      canonical_unit: "deg_c"
      required: true

    - code: "SNWD"
      name: "Snow Depth"
      unit: "inches"
      canonical_name: "snow_depth"
      canonical_unit: "cm"
      required: true

    - code: "WTEQ"
      name: "Snow Water Equivalent"
      unit: "inches"
      canonical_name: "snow_water_equivalent"
      canonical_unit: "mm"
      required: true

    - code: "PREC"
      name: "Precipitation Accumulation"
      unit: "inches"
      canonical_name: "precipitation"
      canonical_unit: "mm"
      required: true

    - code: "WSPDV"
      name: "Wind Speed Vector"
      unit: "mph"
      canonical_name: "wind_speed"
      canonical_unit: "km_h"
      required: false

    - code: "WDIRV"
      name: "Wind Direction Vector"
      unit: "degrees"
      canonical_name: "wind_direction"
      canonical_unit: "degrees"
      required: false

  stations:
    - station_id: "335"
      station_triplet: "335:CO:SNTL"
      name: "Berthoud Summit"
      zone_id: "CO_FRONT_RANGE"
      zone_name: "Front Range"
      latitude: 39.7980
      longitude: -105.7780
      elevation_m: 3444.0
      default_slope_deg: 38.0
      default_aspect_deg: 45.0
      enabled: true

    - station_id: "586"
      station_triplet: "586:CO:SNTL"
      name: "Loveland Basin"
      zone_id: "CO_FRONT_RANGE"
      zone_name: "Front Range"
      latitude: 39.6739
      longitude: -105.8972
      elevation_m: 3475.0
      default_slope_deg: 37.0
      default_aspect_deg: 90.0
      enabled: true

    - station_id: "505"
      station_triplet: "505:CO:SNTL"
      name: "Grizzly Peak"
      zone_id: "CO_VAIL_SUMMIT"
      zone_name: "Vail & Summit County"
      latitude: 39.6450
      longitude: -105.8670
      elevation_m: 3383.0
      default_slope_deg: 36.0
      default_aspect_deg: 45.0
